<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients CRM — POST Bridge Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #111);
    }

    .card {
      max-width: 680px;
      margin: 0 auto 14px;
      padding: 16px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    h2 {
      margin-top: 0;
    }

    .good {
      color: #16803a;
      font-weight: 700;
    }

    .bad {
      color: #b42318;
      font-weight: 700;
    }

    .muted {
      color: var(--tg-theme-hint-color, #666);
      font-size: 13px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(127,127,127,.08);
      padding: 12px;
      border-radius: 10px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>CRM — POST bridge</h2>
  <div id="status">Запуск…</div>
  <div class="muted" id="details"></div>
</div>

<div class="card">
  <strong>Ответ сервера</strong>
  <pre id="result">—</pre>
</div>

<iframe
  name="crmBridgeFrame"
  id="crmBridgeFrame"
></iframe>

<form
  id="crmBridgeForm"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbyRI0tfKU3q3J77UJdhfkXFphr5kmUNC4wy5PknQZWqHYAIYYHSuiQMlpU6QrJGiDQg/exec?bridge=1"
  target="crmBridgeFrame"
>
  <input type="hidden" name="bridge" value="1">
  <input type="hidden" name="requestId" id="requestId">
  <input type="hidden" name="method" value="apiAuthCheck">
  <input type="hidden" name="initData" id="initData">
  <input type="hidden" name="args" value="[]">
</form>

<script>
const tg = window.Telegram?.WebApp;
let currentRequestId = '';

function setStatus(text, ok = null) {
  const el = document.getElementById('status');

  if (ok === true) {
    el.className = 'good';
  } else if (ok === false) {
    el.className = 'bad';
  } else {
    el.className = '';
  }

  el.textContent = text;
}

function setResult(value) {
  document.getElementById('result').textContent =
    typeof value === 'string'
      ? value
      : JSON.stringify(value, null, 2);
}

function isTrustedGoogleOrigin(origin) {
  try {
    const url = new URL(origin);

    return (
      url.protocol === 'https:' &&
      (
        url.hostname === 'script.google.com' ||
        url.hostname.endsWith('.googleusercontent.com')
      )
    );
  } catch (error) {
    return false;
  }
}

function boot() {
  if (!tg) {
    setStatus('❌ Telegram.WebApp не найден', false);
    return;
  }

  tg.ready();
  tg.expand();

  const initData = tg.initData || '';

  document.getElementById('details').textContent =
    'initData length: ' + initData.length;

  if (!initData) {
    setStatus('❌ Telegram не передал initData', false);
    return;
  }

  currentRequestId =
    'REQ-' +
    Date.now() +
    '-' +
    Math.random().toString(16).slice(2);

  document.getElementById('requestId').value =
    currentRequestId;

  document.getElementById('initData').value =
    initData;

  setStatus('Telegram initData получен. Отправляю в Apps Script…');

  document.getElementById('crmBridgeForm').submit();
}

window.addEventListener('message', function(event) {
  if (!isTrustedGoogleOrigin(event.origin)) {
    return;
  }

  const message = event.data || {};

  if (
    message.type !== 'CRM_API_RESPONSE' ||
    message.requestId !== currentRequestId
  ) {
    return;
  }

  if (message.ok) {
    setStatus(
      '✅ Авторизация подтверждена: ' +
      (message.result?.user?.role || 'роль не определена'),
      true
    );

    setResult(message.result);
  } else {
    setStatus('❌ Apps Script отклонил запрос', false);
    setResult(message.error || 'Неизвестная ошибка');
  }
});

document.addEventListener('DOMContentLoaded', boot);
</script>

</body>
</html>
