<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients CRM — Bridge Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #111);
    }

    .card {
      max-width: 680px;
      margin: 0 auto 14px;
      padding: 16px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    h2 {
      margin-top: 0;
    }

    .good {
      color: #16803a;
      font-weight: 700;
    }

    .bad {
      color: #b42318;
      font-weight: 700;
    }

    .muted {
      color: var(--tg-theme-hint-color, #666);
      font-size: 13px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(127,127,127,.08);
      padding: 12px;
      border-radius: 10px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>CRM — диагностика bridge</h2>
  <div id="status">Запуск…</div>
  <div class="muted" id="details"></div>
</div>

<div class="card">
  <strong>События postMessage</strong>
  <pre id="events">Пока сообщений нет.</pre>
</div>

<div class="card">
  <strong>Ответ сервера</strong>
  <pre id="result">—</pre>
</div>

<iframe
  id="crmBridge"
  src="https://script.google.com/macros/s/AKfycbyRI0tfKU3q3J77UJdhfkXFphr5kmUNC4wy5PknQZWqHYAIYYHSuiQMlpU6QrJGiDQg/exec?bridge=1">
</iframe>

<script>
const tg = window.Telegram?.WebApp;

let requestId = null;
let eventLines = [];

function logEvent(text) {
  eventLines.push(text);

  document.getElementById('events').textContent =
    eventLines.join('\n\n');
}

function setStatus(text, cls = '') {
  const el = document.getElementById('status');

  el.className = cls;
  el.textContent = text;
}

function boot() {
  if (!tg) {
    setStatus(
      '❌ Telegram.WebApp не найден',
      'bad'
    );

    return;
  }

  tg.ready();
  tg.expand();

  const initData = tg.initData || '';

  document.getElementById('details').textContent =
    'initData length: ' + initData.length;

  if (!initData) {
    setStatus(
      '❌ Telegram не передал initData',
      'bad'
    );

    return;
  }

  setStatus(
    'Telegram initData получен. Жду любое сообщение от bridge…'
  );
}

window.addEventListener(
  'message',
  function(event) {

    const data = event.data || {};

    logEvent(
      'origin: ' +
      event.origin +
      '\ntype: ' +
      String(data.type || '—')
    );

    if (
      data.type ===
      'CRM_BRIDGE_READY'
    ) {

      setStatus(
        'Bridge ответил. Отправляю initData…',
        'good'
      );

      requestId =
        'REQ-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(16)
          .slice(2);

      document
        .getElementById('crmBridge')
        .contentWindow
        .postMessage(
          {
            type:
              'CRM_API_REQUEST',

            requestId:
              requestId,

            method:
              'apiAuthCheck',

            args: [
              tg.initData
            ]
          },

          event.origin
        );

      return;
    }

    if (
      data.type ===
        'CRM_API_RESPONSE' &&
      data.requestId ===
        requestId
    ) {

      if (data.ok) {

        setStatus(
          '✅ Авторизация подтверждена: ' +
          (
            data.result?.user?.role ||
            'роль не определена'
          ),
          'good'
        );

        document
          .getElementById('result')
          .textContent =
            JSON.stringify(
              data.result,
              null,
              2
            );

      } else {

        setStatus(
          '❌ Apps Script вернул ошибку',
          'bad'
        );

        document
          .getElementById('result')
          .textContent =
            String(
              data.error ||
              'Неизвестная ошибка'
            );
      }
    }
  }
);

document.addEventListener(
  'DOMContentLoaded',
  boot
);
</script>

</body>
</html>
