<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clients CRM v1.0</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f3f4f6);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111827);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --link: var(--tg-theme-link-color, #2481cc);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(127,127,127,.22);
      --danger: #b42318;
      --success: #16803a;
      --radius: 15px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button { cursor: pointer; }

    .hidden { display: none !important; }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: max(12px, env(safe-area-inset-top)) 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 21px; }

    .role {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--card);
      color: var(--hint);
      font-size: 12px;
      white-space: nowrap;
    }

    .search { margin-top: 10px; }

    .search input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }

    .events-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 12px 2px;
    }

    .event-summary {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      color: var(--text);
      padding: 10px 8px;
      text-align: center;
      min-width: 0;
    }

    .event-summary-title {
      color: var(--hint);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .event-summary-count {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.1;
    }

    .event-summary.has-events .event-summary-count {
      color: var(--button);
    }

    .event-date-group {
      margin-bottom: 14px;
    }

    .event-date-title {
      position: sticky;
      top: 55px;
      z-index: 2;
      margin: 0 0 7px;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--bg);
      color: var(--hint);
      font-size: 12px;
      font-weight: 700;
    }

    .event-card {
      margin-bottom: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
    }

    .event-time {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .event-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .event-meta {
      color: var(--hint);
      font-size: 13px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .tabs {
      display: flex;
      gap: 7px;
      padding: 10px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
    }

    .tab.active {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
    }

    .summary {
      padding: 0 14px 8px;
      color: var(--hint);
      font-size: 13px;
    }

    .list { padding: 0 10px; }

    .client {
      margin-bottom: 9px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .client-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .client-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .status {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--hint);
      font-size: 11px;
    }

    .client-line {
      margin-top: 7px;
      color: var(--hint);
      font-size: 14px;
      line-height: 1.35;
    }

    .client-line strong { color: var(--text); }

    .comment { white-space: pre-wrap; }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--hint);
    }

    .fab {
      position: fixed;
      right: 18px;

      /*
       * На мобильном Telegram нижняя служебная зона
       * перекрывает край viewport. Поэтому кнопку
       * поднимаем выше + учитываем safe-area iPhone.
       */
      bottom: calc(82px + env(safe-area-inset-bottom));

      z-index: 1000;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: var(--button);
      color: var(--button-text);
      font-size: 30px;
      line-height: 1;
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
    }

    @media (min-width: 700px) {
      .fab {
        bottom: 24px;
      }
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.16);
    }

    .loader-box {
      padding: 18px 22px;
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 5px 24px rgba(0,0,0,.18);
    }

    .access-denied {
      max-width: 520px;
      margin: 40px auto;
      padding: 24px 18px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
    }

    .access-denied-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .access-denied-title {
      margin-bottom: 8px;
      font-size: 21px;
      font-weight: 700;
    }

    .access-denied-text {
      color: var(--hint);
      line-height: 1.45;
    }

    .error {
      max-width: 700px;
      margin: 30px auto;
      padding: 18px;
      border-radius: 14px;
      background: var(--card);
      color: var(--danger);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow-y: auto;
      background: var(--bg);
    }

    .overlay-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: max(12px, env(safe-area-inset-top)) 12px 11px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .back {
      border: 0;
      background: transparent;
      color: var(--link);
      padding: 6px;
    }

    .overlay-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 700;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 12px 70px;
    }

    .section {
      margin-bottom: 11px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .section-title {
      margin-bottom: 10px;
      font-weight: 700;
    }

    .detail-row {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child { border-bottom: 0; }

    .detail-label {
      color: var(--hint);
      font-size: 12px;
    }

    .detail-value {
      margin-top: 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-value a { color: var(--link); }

    .link-btn {
      display: block;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--link);
      text-align: center;
      text-decoration: none;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quick-btn {
      padding: 11px 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--card);
      color: var(--text);
      text-align: left;
      line-height: 1.25;
    }

    .quick-btn strong {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: var(--hint);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-panel {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .quick-panel-title {
      margin-bottom: 7px;
      font-weight: 700;
    }

    .quick-panel-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-panel-actions .btn {
      flex: 1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      padding: 10px 13px;
      border: 0;
      border-radius: 11px;
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
    }

    .btn.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn.danger {
      background: var(--danger);
      color: #fff;
    }

    .btn.full { width: 100%; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
    }

    @media (min-width: 650px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--hint);
      font-size: 12px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      transform: scale(1.2);
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
    }

    .checkbox-line label {
      margin: 0;
      color: var(--text);
      font-size: 14px;
    }

    iframe { display: none; }
  </style>
</head>

<body>

<div id="loader" class="loader">
  <div class="loader-box">Загрузка CRM…</div>
</div>

<div id="errorBox" class="error hidden"></div>

<div id="accessDenied" class="access-denied hidden">
  <div class="access-denied-icon">🔒</div>
  <div class="access-denied-title">Нет доступа к CRM</div>
  <div class="access-denied-text">
    Этот Telegram-аккаунт не имеет доступа к системе.<br>
    Для доступа пользователь должен быть администратором
    или участником разрешённой VIEWER-группы.
  </div>
</div>

<div id="app" class="app hidden">

  <div class="topbar">
    <div class="title-row">
      <h1>Клиенты</h1>
      <div id="roleBadge" class="role"></div>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Поиск по ФИО, телефону, делу…">
    </div>
  </div>

  <div class="events-strip">
    <button class="event-summary" id="eventToday" type="button">
      <div class="event-summary-title">Сегодня</div>
      <div class="event-summary-count" id="eventTodayCount">0</div>
    </button>

    <button class="event-summary" id="eventTomorrow" type="button">
      <div class="event-summary-title">Завтра</div>
      <div class="event-summary-count" id="eventTomorrowCount">0</div>
    </button>

    <button class="event-summary" id="eventWeek" type="button">
      <div class="event-summary-title">7 дней</div>
      <div class="event-summary-count" id="eventWeekCount">0</div>
    </button>
  </div>

  <div id="tabs" class="tabs"></div>
  <div id="summary" class="summary"></div>
  <div id="clientList" class="list"></div>

</div>

<button
  id="addButton"
  class="fab hidden"
  title="Добавить клиента"
  aria-label="Добавить клиента"
>
  +
</button>

<div id="eventsOverlay" class="overlay hidden">
  <div class="overlay-header">
    <button class="back" onclick="closeEvents()">← Назад</button>
    <div id="eventsTitle" class="overlay-title">Ближайшие события</div>
  </div>

  <div id="eventsContent" class="content"></div>
</div>

<div id="clientOverlay" class="overlay hidden">
  <div class="overlay-header">
    <button class="back" onclick="closeClient()">← Назад</button>
    <div id="clientTitle" class="overlay-title">Клиент</div>
  </div>

  <div id="clientContent" class="content"></div>
</div>

<div id="editOverlay" class="overlay hidden">
  <div class="overlay-header">
    <button class="back" onclick="closeEdit()">← Назад</button>
    <div id="formTitle" class="overlay-title">Редактирование</div>
  </div>

  <div class="content">
    <form id="editForm">

      <div class="section">
        <div class="section-title">Основные данные</div>

        <div class="grid two">
          <div>
            <label>ФИО *</label>
            <input id="eName" required>
          </div>

          <div>
            <label>Телефон *</label>
            <input id="ePhone" type="tel" required>
          </div>

          <div>
            <label>Получил</label>
            <input id="eReceivedDate" type="date">
          </div>

          <div class="checkbox-line">
            <input id="ePower" type="checkbox">
            <label for="ePower">Доверенность получена</label>
          </div>

          <div>
            <label>Ответчик</label>
            <input id="eDefendant">
          </div>

          <div>
            <label>Статус</label>
            <select id="eStatus"></select>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Суд и событие</div>

        <div class="grid two">
          <div>
            <label>Отправил в суд</label>
            <input id="eSentDate" type="date">
          </div>

          <div>
            <label>Судья</label>
            <input id="eJudge">
          </div>

          <div>
            <label>Номер дела</label>
            <input id="eCaseNumber">
          </div>

          <div>
            <label>Следующая дата</label>
            <input id="eNextDate" type="date">
          </div>

          <div>
            <label>Время</label>
            <input id="eNextTime" type="time">
          </div>

          <div>
            <label>Эксперт</label>
            <input id="eExpert">
          </div>
        </div>

        <div style="margin-top:11px">
          <label>Комментарий</label>
          <textarea
            id="eComment"
            placeholder="Текущий комментарий по клиенту"
          ></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Ссылки и выплата</div>

        <div class="grid">
          <div>
            <label>Сканы</label>
            <input id="eScans" type="url" placeholder="https://...">
          </div>

          <div>
            <label>Карточка дела</label>
            <input id="eCaseCard" type="url" placeholder="https://...">
          </div>
        </div>

        <div class="grid two" style="margin-top:11px">
          <div>
            <label>Общая сумма выплаты</label>
            <input id="eTotal" type="number" min="0" step="0.01">
          </div>

          <div>
            <label>Остаток</label>
            <input id="eBalance" type="number" min="0" step="0.01">
          </div>

          <div>
            <label>Остаток указан как</label>
            <select id="eBalanceType">
              <option value="amount">Сумма ₽</option>
              <option value="percent">Процент от общей выплаты</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn full" type="submit">💾 Сохранить изменения</button>
    </form>
  </div>
</div>

<iframe name="crmBridgeFrame" id="crmBridgeFrame"></iframe>

<form id="crmBridgeForm" method="POST" action="https://script.google.com/macros/s/AKfycbyRI0tfKU3q3J77UJdhfkXFphr5kmUNC4wy5PknQZWqHYAIYYHSuiQMlpU6QrJGiDQg/exec?bridge=1" target="crmBridgeFrame">
  <input type="hidden" name="bridge" value="1">
  <input type="hidden" name="requestId" id="bridgeRequestId">
  <input type="hidden" name="method" id="bridgeMethod">
  <input type="hidden" name="initData" id="bridgeInitData">
  <input type="hidden" name="args" id="bridgeArgs">
</form>

<script>
const tg = window.Telegram?.WebApp;

const state = {
  initData: '',
  role: '',
  user: null,
  statuses: [],
  clients: [],
  archiveClients: [],
  activeTab: 'Все клиенты',
  currentClient: null,
  currentClientData: null,
  formMode: 'edit',
  pending: new Map()
};

document.addEventListener('DOMContentLoaded', boot);

function boot() {
  if (!tg) {
    fatal('Telegram.WebApp не найден.');
    return;
  }

  tg.ready();
  tg.expand();

  state.initData = tg.initData || '';

  if (!state.initData) {
    fatal('Telegram не передал данные авторизации.');
    return;
  }

  document.getElementById('searchInput')
    .addEventListener('input', renderClients);

  document.getElementById('editForm')
    .addEventListener('submit', saveEdit);

  document.getElementById('addButton')
    .addEventListener('click', openCreate);

  document.getElementById('eventToday')
    .addEventListener('click', () => openEvents('today'));

  document.getElementById('eventTomorrow')
    .addEventListener('click', () => openEvents('tomorrow'));

  document.getElementById('eventWeek')
    .addEventListener('click', () => openEvents('week'));

  apiCall('apiInit', [])
    .then(data => {
      state.role = data.user.role;
      state.user = data.user;
      state.statuses = data.statuses || [];
      state.clients = data.clients || [];

      document.getElementById('roleBadge').textContent =
        state.role === 'ADMIN' ? 'Администратор' : 'Просмотр';

      if (state.role === 'ADMIN') {
        document.getElementById('addButton')
          .classList.remove('hidden');
      }

      buildTabs();
      renderClients();
      renderEventCounters();

      hideLoader();
      document.getElementById('app').classList.remove('hidden');
    })
    .catch(error => {
      const message =
        error && error.message
          ? error.message
          : String(error);

      if (
        message.includes('ACCESS_DENIED') ||
        message.includes('нет доступа к CRM')
      ) {
        showAccessDenied();
      } else {
        fatal(message);
      }
    });
}

function apiCall(method, args) {
  return new Promise((resolve, reject) => {
    const requestId =
      'REQ-' + Date.now() + '-' + Math.random().toString(16).slice(2);

    state.pending.set(requestId, { resolve, reject });

    document.getElementById('bridgeRequestId').value = requestId;
    document.getElementById('bridgeMethod').value = method;
    document.getElementById('bridgeInitData').value = state.initData;
    document.getElementById('bridgeArgs').value = JSON.stringify(args || []);

    document.getElementById('crmBridgeForm').submit();

    setTimeout(() => {
      if (state.pending.has(requestId)) {
        state.pending.delete(requestId);
        reject(new Error('Сервер не ответил вовремя.'));
      }
    }, 20000);
  });
}

window.addEventListener('message', function(event) {
  if (!isTrustedGoogleOrigin(event.origin)) return;

  const message = event.data || {};

  if (message.type !== 'CRM_API_RESPONSE') return;

  const pending = state.pending.get(message.requestId);

  if (!pending) return;

  state.pending.delete(message.requestId);

  if (message.ok) {
    pending.resolve(message.result);
  } else {
    pending.reject(new Error(message.error || 'Ошибка Apps Script.'));
  }
});

function isTrustedGoogleOrigin(origin) {
  try {
    const url = new URL(origin);

    return (
      url.protocol === 'https:' &&
      (
        url.hostname === 'script.google.com' ||
        url.hostname.endsWith('.googleusercontent.com')
      )
    );
  } catch (error) {
    return false;
  }
}


function parseRuDate(value) {
  const match =
    String(value || '')
      .trim()
      .match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

  if (!match) return null;

  return new Date(
    Number(match[3]),
    Number(match[2]) - 1,
    Number(match[1]),
    12,
    0,
    0,
    0
  );
}

function startOfLocalDay(date) {
  return new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate(),
    12,
    0,
    0,
    0
  );
}

function addDays(date, days) {
  const result = new Date(date.getTime());
  result.setDate(result.getDate() + days);
  return result;
}

function dateKey(date) {
  return (
    String(date.getDate()).padStart(2, '0') +
    '.' +
    String(date.getMonth() + 1).padStart(2, '0') +
    '.' +
    date.getFullYear()
  );
}

function clientsForDate(date) {
  const key = dateKey(date);

  return state.clients
    .filter(client =>
      !client.archive &&
      client.nextDate === key
    )
    .sort(compareEvents);
}

function clientsForPeriod(fromDate, toDate) {
  const from = startOfLocalDay(fromDate).getTime();
  const to = startOfLocalDay(toDate).getTime();

  return state.clients
    .filter(client => {
      if (client.archive || !client.nextDate) {
        return false;
      }

      const date = parseRuDate(client.nextDate);

      if (!date) return false;

      const time = date.getTime();

      return time >= from && time <= to;
    })
    .sort((a, b) => {
      const da = parseRuDate(a.nextDate);
      const db = parseRuDate(b.nextDate);

      const dateDiff =
        (da ? da.getTime() : 0) -
        (db ? db.getTime() : 0);

      return dateDiff !== 0
        ? dateDiff
        : compareEvents(a, b);
    });
}

function compareEvents(a, b) {
  const timeA = a.nextTime || '99:99';
  const timeB = b.nextTime || '99:99';

  const timeDiff =
    timeA.localeCompare(timeB);

  if (timeDiff !== 0) {
    return timeDiff;
  }

  return String(a.name || '')
    .localeCompare(
      String(b.name || ''),
      'ru',
      { sensitivity: 'base' }
    );
}

function renderEventCounters() {
  const today =
    startOfLocalDay(new Date());

  const tomorrow =
    addDays(today, 1);

  const weekEnd =
    addDays(today, 6);

  const todayCount =
    clientsForDate(today).length;

  const tomorrowCount =
    clientsForDate(tomorrow).length;

  const weekCount =
    clientsForPeriod(today, weekEnd).length;

  setEventCounter(
    'eventToday',
    'eventTodayCount',
    todayCount
  );

  setEventCounter(
    'eventTomorrow',
    'eventTomorrowCount',
    tomorrowCount
  );

  setEventCounter(
    'eventWeek',
    'eventWeekCount',
    weekCount
  );
}

function setEventCounter(buttonId, countId, count) {
  document.getElementById(countId).textContent =
    String(count);

  document.getElementById(buttonId)
    .classList.toggle(
      'has-events',
      count > 0
    );
}

function openEvents(mode) {
  const today =
    startOfLocalDay(new Date());

  let clients = [];
  let title = '';

  if (mode === 'today') {
    clients =
      clientsForDate(today);

    title =
      'Сегодня · ' +
      dateKey(today);

  } else if (mode === 'tomorrow') {
    const tomorrow =
      addDays(today, 1);

    clients =
      clientsForDate(tomorrow);

    title =
      'Завтра · ' +
      dateKey(tomorrow);

  } else {
    const weekEnd =
      addDays(today, 6);

    clients =
      clientsForPeriod(
        today,
        weekEnd
      );

    title = 'Ближайшие 7 дней';
  }

  document.getElementById('eventsTitle').textContent =
    title;

  renderEventsList(clients);

  document.getElementById('eventsOverlay')
    .classList.remove('hidden');
}

function closeEvents() {

    .classList.add('hidden');
}

function renderEventsList(clients) {
  const box =
    document.getElementById('eventsContent');

  if (!clients.length) {
    box.innerHTML =
      '<div class="empty">Событий нет</div>';

    return;
  }

  const groups = {};

  clients.forEach(client => {
    const key =
      client.nextDate || 'Без даты';

    if (!groups[key]) {
      groups[key] = [];
    }

    groups[key].push(client);
  });

  box.innerHTML =
    Object.keys(groups)
      .map(date => {
        const cards =
          groups[date]
            .map(client => eventCardHtml(client))
            .join('');

        return (
          '<div class="event-date-group">' +
            '<div class="event-date-title">' +
              esc(date) +
            '</div>' +
            cards +
          '</div>'
        );
      })
      .join('');
}

function buildTabs() {
  const tabs = ['Все клиенты'].concat(state.statuses || []);

  if (state.role === 'ADMIN') {
    tabs.push('Архив');
  }

  const box = document.getElementById('tabs');

  box.innerHTML = '';

  tabs.forEach(name => {
    const btn = document.createElement('button');

    btn.className = 'tab' + (name === state.activeTab ? ' active' : '');
    btn.textContent = name;

    btn.onclick = () => {
      state.activeTab = name;
      buildTabs();

      if (name === 'Архив') {
        loadArchive();
      } else {
        renderClients();
      }
    };

    box.appendChild(btn);
  });
}

function renderClients() {
  const search = document.getElementById('searchInput')
    .value.trim().toLowerCase();

  let clients =
    state.activeTab === 'Архив'
      ? state.archiveClients.slice()
      : state.clients.slice();

  if (state.activeTab === 'Архив') {
    clients = clients.filter(client => Boolean(client.archive));
  } else if (state.activeTab !== 'Все клиенты') {
    clients = clients.filter(client =>
      String(client.status || '').toLowerCase() ===
      state.activeTab.toLowerCase()
    );
  }

  if (search) {
    clients = clients.filter(client => {
      const haystack = [
        client.name,
        client.phone,
        client.caseNumber,
        client.judge,
        client.defendant,
        client.comment,
        client.status
      ].join(' ').toLowerCase();

      return haystack.includes(search);
    });
  }

  document.getElementById('summary').textContent =
    'Клиентов: ' + clients.length;

  const container = document.getElementById('clientList');

  if (!clients.length) {
    container.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  container.innerHTML = clients.map(clientCardHtml).join('');
}

function openQuickAction(type) {
  if (
    state.role !== 'ADMIN' ||
    !state.currentClient
  ) {
    return;
  }

  const c = state.currentClient;
  const panel = document.getElementById('quickPanel');

  if (!panel) return;

  let html = '';

  if (type === 'status') {
    html =
      '<div class="quick-panel-title">📌 Новый статус</div>' +
      '<select id="quickValue">' +
        state.statuses.map(status =>
          '<option value="' +
            escAttr(status) +
            '"' +
            (
              status === c.status
                ? ' selected'
                : ''
            ) +
          '>' +
            esc(status) +
          '</option>'
        ).join('') +
      '</select>';

  } else if (type === 'date') {
    html =
      '<div class="quick-panel-title">📅 Следующая дата</div>' +
      '<input id="quickValue" type="date" value="' +
        escAttr(dateToInput(c.nextDate)) +

  } else if (type === 'time') {
    html =
      '<div class="quick-panel-title">🕐 Время</div>' +
      '<input id="quickValue" type="time" value="' +
        escAttr(c.nextTime || '') +
      '">';

  } else if (type === 'comment') {
    html =
      '<div class="quick-panel-title">💬 Комментарий</div>' +
      '<textarea id="quickValue" placeholder="Комментарий…">' +
        esc(c.comment || '') +
      '</textarea>';
  } else {
    return;
  }

  html +=
    '<div class="quick-panel-actions">' +
      '<button class="btn secondary" type="button" onclick="closeQuickAction()">Отмена</button>' +
      '<button class="btn" type="button" id="quickSaveButton">Сохранить</button>' +
    '</div>';

  panel.innerHTML = html;
  panel.classList.remove('hidden');

  document
    .getElementById('quickSaveButton')
    .addEventListener(
      'click',
      function() {
        saveQuickAction(type);
      }
    );

  return;

      ),

      ),

      ),

function saveQuickAction(type) {
  if (
    state.role !== 'ADMIN' ||
    !state.currentClient
  ) {
    return;
  }

  const input =
    document.getElementById('quickValue');

  if (!input) return;

  const payload =
    currentClientPayload();

  const value =
    input.value;

  if (type === 'status') {
    payload.status = value;

  } else if (type === 'date') {
    payload.nextDate = value;

  } else if (type === 'time') {
    payload.nextTime = value;

  } else if (type === 'comment') {
    payload.comment =
      String(value || '').trim();

  } else {
    return;
  }

  showLoader();

  apiCall(
    'apiUpdateClient',
    [
      state.currentClient.id,
      payload
    ]
  )
    .then(data => {
      state.currentClient =
        data.client;

      state.currentClientData =
        data;

      renderClientDetail(
        data
      );

      return refreshClients();
    })
    .then(() => {
      hideLoader();
    })
    .catch(error => {
      hideLoader();

      alert(
        error.message ||
        String(error)
      );
    });
}

function saveEdit(event) {
  event.preventDefault();

  if (state.role !== 'ADMIN') return;

  if (
    state.formMode === 'edit' &&
    !state.currentClient
  ) {
    return;
  }

  const payload = {
    name: val('eName'),
    phone: val('ePhone'),
    receivedDate: val('eReceivedDate'),
    powerOfAttorney: document.getElementById('ePower').checked,
    defendant: val('eDefendant'),
    status: val('eStatus'),
    sentToCourtDate: val('eSentDate'),
    judge: val('eJudge'),
    caseNumber: val('eCaseNumber'),
    nextDate: val('eNextDate'),
    nextTime: val('eNextTime'),
    expert: val('eExpert'),
    comment: val('eComment'),
    scans: val('eScans'),
    caseCard: val('eCaseCard'),
    totalPayment: val('eTotal'),
    balance: val('eBalance'),
    balanceType: val('eBalanceType')
  };

  showLoader();

  const request =
    state.formMode === 'create'
      ? apiCall('apiCreateClient', [payload])
      : apiCall('apiUpdateClient', [state.currentClient.id, payload]);

  request
    .then(data => {
      state.currentClient = data.client;
      state.currentClientData = data;

      closeEdit();
      renderClientDetail(data);

      document.getElementById('clientOverlay')
        .classList.remove('hidden');

      return refreshClients();
    })
    .then(() => hideLoader())
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}

function archiveClient() {
  if (state.role !== 'ADMIN' || !state.currentClient) return;

  showLoader();

  apiCall('apiArchiveClient', [state.currentClient.id])

      return refreshClients();

    .catch(error => {

      alert(error.message || String(error));

function restoreClient() {
  if (state.role !== 'ADMIN' || !state.currentClient) return;

  showLoader();

  apiCall('apiRestoreClient', [state.currentClient.id])
    .then(data => {
      state.currentClient = data.client;
      state.currentClientData = data;

      if (state.activeTab === 'Архив') {
        closeClient();
      } else {
        renderClientDetail(data);
      }

      return refreshClients();
    })
    .then(() => hideLoader())
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}


function loadArchive() {
  if (state.role !== 'ADMIN') {
    return;
  }

  showLoader();

  apiCall('apiGetClients', [true])
    .then(clients => {
      state.archiveClients = clients || [];
      renderClients();
      hideLoader();
    })
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}


function refreshClients() {
  return apiCall('apiGetClients', [false])
    .then(clients => {
      state.clients = clients || [];
      renderEventCounters();

      if (state.activeTab === 'Архив') {
        return apiCall('apiGetClients', [true])
          .then(allClients => {
            state.archiveClients = allClients || [];
            renderClients();
          });
      }

      renderClients();
    });
}

function detail(label, value) {
  return (
    '<div class="detail-row">' +
      '<div class="detail-label">' + esc(label) + '</div>' +
      '<div class="detail-value">' + value + '</div>' +
    '</div>'
  );
}

function dateToInput(date) {
  if (!date) return '';

  const match = String(date).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

  if (!match) return '';

  return match[3] + '-' + match[2] + '-' + match[1];
}

function val(id) {
  return document.getElementById(id).value.trim();
}

function money(value) {
  const num = Number(value || 0);

  return new Intl.NumberFormat(
    'ru-RU',
    { maximumFractionDigits: 2 }
  ).format(num) + ' ₽';
}

function showLoader() {
  document.getElementById('loader').classList.remove('hidden');
}

function hideLoader() {
  document.getElementById('loader').classList.add('hidden');
}


function showAccessDenied() {
  hideLoader();

  document
    .getElementById('app')
    .classList
    .add('hidden');

  document
    .getElementById('errorBox')
    .classList
    .add('hidden');

  document
    .getElementById('accessDenied')
    .classList
    .remove('hidden');
}


function fatal(message) {
  hideLoader();
  document.getElementById('app').classList.add('hidden');

  const box = document.getElementById('errorBox');
  box.textContent = 'CRM недоступна: ' + message;
  box.classList.remove('hidden');
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escAttr(value) {
  return esc(value);
}
</script>
