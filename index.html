<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clients CRM VIEWER Security Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f3f4f6);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111827);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --link: var(--tg-theme-link-color, #2481cc);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(127,127,127,.22);
      --danger: #b42318;
      --success: #16803a;
      --radius: 15px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button { cursor: pointer; }

    .hidden { display: none !important; }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: max(12px, env(safe-area-inset-top)) 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 21px; }

    .role {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--card);
      color: var(--hint);
      font-size: 12px;
      white-space: nowrap;
    }

    .search { margin-top: 10px; }

    .search input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }

    .tabs {
      display: flex;
      gap: 7px;
      padding: 10px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
    }

    .tab.active {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
    }

    .summary {
      padding: 0 14px 8px;
      color: var(--hint);
      font-size: 13px;
    }

    .list { padding: 0 10px; }

    .client {
      margin-bottom: 9px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .client-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .client-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .status {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--hint);
      font-size: 11px;
    }

    .client-line {
      margin-top: 7px;
      color: var(--hint);
      font-size: 14px;
      line-height: 1.35;
    }

    .client-line strong { color: var(--text); }

    .comment { white-space: pre-wrap; }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--hint);
    }

    .viewer-test {
      margin-top: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 11px;
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }

    .fab {
      position: fixed;
      right: 18px;

      /*
       * На мобильном Telegram нижняя служебная зона
       * перекрывает край viewport. Поэтому кнопку
       * поднимаем выше + учитываем safe-area iPhone.
       */
      bottom: calc(82px + env(safe-area-inset-bottom));

      z-index: 1000;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: var(--button);
      color: var(--button-text);
      font-size: 30px;
      line-height: 1;
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
    }

    @media (min-width: 700px) {
      .fab {
        bottom: 24px;
      }
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.16);
    }

    .loader-box {
      padding: 18px 22px;
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 5px 24px rgba(0,0,0,.18);
    }

    .error {
      max-width: 700px;
      margin: 30px auto;
      padding: 18px;
      border-radius: 14px;
      background: var(--card);
      color: var(--danger);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow-y: auto;
      background: var(--bg);
    }

    .overlay-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: max(12px, env(safe-area-inset-top)) 12px 11px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .back {
      border: 0;
      background: transparent;
      color: var(--link);
      padding: 6px;
    }

    .overlay-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 700;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 12px 70px;
    }

    .section {
      margin-bottom: 11px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .section-title {
      margin-bottom: 10px;
      font-weight: 700;
    }

    .detail-row {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child { border-bottom: 0; }

    .detail-label {
      color: var(--hint);
      font-size: 12px;
    }

    .detail-value {
      margin-top: 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-value a { color: var(--link); }

    .link-btn {
      display: block;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--link);
      text-align: center;
      text-decoration: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      padding: 10px 13px;
      border: 0;
      border-radius: 11px;
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
    }

    .btn.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn.danger {
      background: var(--danger);
      color: #fff;
    }

    .btn.full { width: 100%; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
    }

    @media (min-width: 650px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--hint);
      font-size: 12px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      transform: scale(1.2);
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
    }

    .checkbox-line label {
      margin: 0;
      color: var(--text);
      font-size: 14px;
    }

    iframe { display: none; }
  </style>
</head>

<body>

<div id="loader" class="loader">
  <div class="loader-box">Загрузка CRM…</div>
</div>

<div id="errorBox" class="error hidden"></div>

<div id="app" class="app hidden">

  <div class="topbar">
    <div class="title-row">
      <h1>Клиенты</h1>
      <div id="roleBadge" class="role"></div>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Поиск по ФИО, телефону, делу…">
    </div>

    <button
      id="viewerProtectionTest"
      class="viewer-test hidden"
      type="button"
    >
      🔒 Проверить серверную защиту VIEWER
    </button>
  </div>

  <div id="tabs" class="tabs"></div>
  <div id="summary" class="summary"></div>
  <div id="clientList" class="list"></div>

</div>

<button
  id="addButton"
  class="fab hidden"
  title="Добавить клиента"
  aria-label="Добавить клиента"
>
  +
</button>

<div id="clientOverlay" class="overlay hidden">
  <div class="overlay-header">
    <button class="back" onclick="closeClient()">← Назад</button>
    <div id="clientTitle" class="overlay-title">Клиент</div>
  </div>

  <div id="clientContent" class="content"></div>
</div>

<div id="editOverlay" class="overlay hidden">
  <div class="overlay-header">
    <button class="back" onclick="closeEdit()">← Назад</button>
    <div id="formTitle" class="overlay-title">Редактирование</div>
  </div>

  <div class="content">
    <form id="editForm">

      <div class="section">
        <div class="section-title">Основные данные</div>

        <div class="grid two">
          <div>
            <label>ФИО *</label>
            <input id="eName" required>
          </div>

          <div>
            <label>Телефон *</label>
            <input id="ePhone" type="tel" required>
          </div>

          <div>
            <label>Получил</label>
            <input id="eReceivedDate" type="date">
          </div>

          <div class="checkbox-line">
            <input id="ePower" type="checkbox">
            <label for="ePower">Доверенность получена</label>
          </div>

          <div>
            <label>Ответчик</label>
            <input id="eDefendant">
          </div>

          <div>
            <label>Статус</label>
            <select id="eStatus"></select>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Суд и событие</div>

        <div class="grid two">
          <div>
            <label>Отправил в суд</label>
            <input id="eSentDate" type="date">
          </div>

          <div>
            <label>Судья</label>
            <input id="eJudge">
          </div>

          <div>
            <label>Номер дела</label>
            <input id="eCaseNumber">
          </div>

          <div>
            <label>Следующая дата</label>
            <input id="eNextDate" type="date">
          </div>

          <div>
            <label>Время</label>
            <input id="eNextTime" type="time">
          </div>

          <div>
            <label>Эксперт</label>
            <input id="eExpert">
          </div>
        </div>

        <div style="margin-top:11px">
          <label>Комментарий</label>
          <textarea
            id="eComment"
            placeholder="Текущий комментарий по клиенту"
          ></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Ссылки и выплата</div>

        <div class="grid">
          <div>
            <label>Сканы</label>
            <input id="eScans" type="url" placeholder="https://...">
          </div>

          <div>
            <label>Карточка дела</label>
            <input id="eCaseCard" type="url" placeholder="https://...">
          </div>
        </div>

        <div class="grid two" style="margin-top:11px">
          <div>
            <label>Общая сумма выплаты</label>
            <input id="eTotal" type="number" min="0" step="0.01">
          </div>

          <div>
            <label>Остаток</label>
            <input id="eBalance" type="number" min="0" step="0.01">
          </div>

          <div>
            <label>Остаток указан как</label>
            <select id="eBalanceType">
              <option value="amount">Сумма ₽</option>
              <option value="percent">Процент от общей выплаты</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn full" type="submit">💾 Сохранить изменения</button>
    </form>
  </div>
</div>

<iframe name="crmBridgeFrame" id="crmBridgeFrame"></iframe>

<form id="crmBridgeForm" method="POST" action="https://script.google.com/macros/s/AKfycbyRI0tfKU3q3J77UJdhfkXFphr5kmUNC4wy5PknQZWqHYAIYYHSuiQMlpU6QrJGiDQg/exec?bridge=1" target="crmBridgeFrame">
  <input type="hidden" name="bridge" value="1">
  <input type="hidden" name="requestId" id="bridgeRequestId">
  <input type="hidden" name="method" id="bridgeMethod">
  <input type="hidden" name="initData" id="bridgeInitData">
  <input type="hidden" name="args" id="bridgeArgs">
</form>

<script>
const tg = window.Telegram?.WebApp;

const state = {
  initData: '',
  role: '',
  user: null,
  statuses: [],
  clients: [],
  activeTab: 'Все клиенты',
  currentClient: null,
  currentClientData: null,
  formMode: 'edit',
  pending: new Map()
};

document.addEventListener('DOMContentLoaded', boot);

function boot() {
  if (!tg) {
    fatal('Telegram.WebApp не найден.');
    return;
  }

  tg.ready();
  tg.expand();

  state.initData = tg.initData || '';

  if (!state.initData) {
    fatal('Telegram не передал данные авторизации.');
    return;
  }

  document.getElementById('searchInput')
    .addEventListener('input', renderClients);

  document.getElementById('editForm')
    .addEventListener('submit', saveEdit);

  document.getElementById('addButton')
    .addEventListener('click', openCreate);

  document.getElementById('viewerProtectionTest')
    .addEventListener('click', testViewerProtection);

  apiCall('apiInit', [])
    .then(data => {
      state.role = data.user.role;
      state.user = data.user;
      state.statuses = data.statuses || [];
      state.clients = data.clients || [];

      document.getElementById('roleBadge').textContent =
        state.role === 'ADMIN' ? 'Администратор' : 'Просмотр';

      if (state.role === 'ADMIN') {
        document.getElementById('addButton')
          .classList.remove('hidden');
      } else if (state.role === 'VIEWER') {
        document.getElementById('viewerProtectionTest')
          .classList.remove('hidden');
      }

      buildTabs();
      renderClients();

      hideLoader();
      document.getElementById('app').classList.remove('hidden');
    })
    .catch(error => fatal(error.message || String(error)));
}

function apiCall(method, args) {
  return new Promise((resolve, reject) => {
    const requestId =
      'REQ-' + Date.now() + '-' + Math.random().toString(16).slice(2);

    state.pending.set(requestId, { resolve, reject });

    document.getElementById('bridgeRequestId').value = requestId;
    document.getElementById('bridgeMethod').value = method;
    document.getElementById('bridgeInitData').value = state.initData;
    document.getElementById('bridgeArgs').value = JSON.stringify(args || []);

    document.getElementById('crmBridgeForm').submit();

    setTimeout(() => {
      if (state.pending.has(requestId)) {
        state.pending.delete(requestId);
        reject(new Error('Сервер не ответил вовремя.'));
      }
    }, 20000);
  });
}

window.addEventListener('message', function(event) {
  if (!isTrustedGoogleOrigin(event.origin)) return;

  const message = event.data || {};

  if (message.type !== 'CRM_API_RESPONSE') return;

  const pending = state.pending.get(message.requestId);

  if (!pending) return;

  state.pending.delete(message.requestId);

  if (message.ok) {
    pending.resolve(message.result);
  } else {
    pending.reject(new Error(message.error || 'Ошибка Apps Script.'));
  }
});

function isTrustedGoogleOrigin(origin) {
  try {
    const url = new URL(origin);

    return (
      url.protocol === 'https:' &&
      (
        url.hostname === 'script.google.com' ||
        url.hostname.endsWith('.googleusercontent.com')
      )
    );
  } catch (error) {
    return false;
  }
}

function buildTabs() {
  const tabs = ['Все клиенты'].concat(state.statuses || []);
  const box = document.getElementById('tabs');

  box.innerHTML = '';

  tabs.forEach(name => {
    const btn = document.createElement('button');

    btn.className = 'tab' + (name === state.activeTab ? ' active' : '');
    btn.textContent = name;

    btn.onclick = () => {
      state.activeTab = name;
      buildTabs();
      renderClients();
    };

    box.appendChild(btn);
  });
}

function renderClients() {
  const search = document.getElementById('searchInput')
    .value.trim().toLowerCase();

  let clients = state.clients.slice();

  if (state.activeTab !== 'Все клиенты') {
    clients = clients.filter(client =>
      String(client.status || '').toLowerCase() ===
      state.activeTab.toLowerCase()
    );
  }

  if (search) {
    clients = clients.filter(client => {
      const haystack = [
        client.name,
        client.phone,
        client.caseNumber,
        client.judge,
        client.defendant,
        client.comment,
        client.status
      ].join(' ').toLowerCase();

      return haystack.includes(search);
    });
  }

  document.getElementById('summary').textContent =
    'Клиентов: ' + clients.length;

  const container = document.getElementById('clientList');

  if (!clients.length) {
    container.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  container.innerHTML = clients.map(clientCardHtml).join('');
}

function clientCardHtml(client) {
  const event = client.nextDate
    ? '<div class="client-line">📅 <strong>' +
      esc(client.nextDate) +
      (client.nextTime ? ' · ' + esc(client.nextTime) : '') +
      '</strong></div>'
    : '';

  const comment = client.comment
    ? '<div class="client-line comment">💬 ' +
      esc(client.comment) +
      '</div>'
    : '';

  return (
    '<div class="client" onclick="openClient(\'' +
    escAttr(client.id) +
    '\')">' +

      '<div class="client-head">' +
        '<div class="client-name">' + esc(client.name) + '</div>' +
        '<div class="status">' + esc(client.status || '—') + '</div>' +
      '</div>' +

      '<div class="client-line">📞 ' + esc(client.phone || '—') + '</div>' +
      event +
      comment +
    '</div>'
  );
}

function openClient(clientId) {
  showLoader();

  apiCall('apiGetClient', [clientId])
    .then(data => {
      state.currentClient = data.client;
      state.currentClientData = data;

      renderClientDetail(data);

      hideLoader();

      document.getElementById('clientOverlay')
        .classList.remove('hidden');
    })
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}

function closeClient() {
  document.getElementById('clientOverlay').classList.add('hidden');
  state.currentClient = null;
  state.currentClientData = null;
}

function renderClientDetail(data) {
  const client = data.client;
  const admin = data.role === 'ADMIN';

  document.getElementById('clientTitle').textContent =
    client.name || 'Клиент';

  let html =
    '<div class="section">' +
      detail('Телефон',
        client.phone
          ? '<a href="tel:' + escAttr(client.phone) + '">' +
            esc(client.phone) +
            '</a>'
          : '—'
      ) +
      detail('Статус', esc(client.status || '—')) +
      detail('Получил', esc(client.receivedDate || '—')) +
      detail('Доверенность', client.powerOfAttorney ? 'Да' : 'Нет') +
      detail('Ответчик', esc(client.defendant || '—')) +
      detail('Отправил в суд', esc(client.sentToCourtDate || '—')) +
      detail('Судья', esc(client.judge || '—')) +
      detail('Номер дела', esc(client.caseNumber || '—')) +
      detail('Следующая дата',
        esc([client.nextDate, client.nextTime].filter(Boolean).join(' · ') || '—')
      ) +
      detail('Комментарий', esc(client.comment || '—')) +
      detail('Эксперт', esc(client.expert || '—')) +
      detail('Общая сумма выплаты', money(client.totalPayment)) +
      detail('Остаток',
        money(client.balance) +
        (client.totalPayment > 0
          ? ' (' + client.balancePercent + '%)'
          : '')
      ) +
      detail('Последнее изменение', esc(client.timestamp || '—')) +
    '</div>';

  if (client.scans || client.caseCard) {
    html +=
      '<div class="section">' +
      '<div class="section-title">Ссылки</div>';

    if (client.scans) {
      html +=
        '<a class="link-btn" href="' +
        escAttr(client.scans) +
        '" target="_blank">📂 Открыть сканы</a>';
    }

    if (client.caseCard) {
      html +=
        '<a class="link-btn" href="' +
        escAttr(client.caseCard) +
        '" target="_blank">⚖️ Открыть карточку дела</a>';
    }

    html += '</div>';
  }

  if (admin) {
    html +=
      '<div class="section">' +
        '<div class="section-title">Действия</div>' +
        '<div class="actions">' +
          '<button class="btn" onclick="openEdit()">✏️ Редактировать</button>' +
          (
            client.archive
              ? '<button class="btn secondary" onclick="restoreClient()">↩️ Вернуть из архива</button>'
              : '<button class="btn danger" onclick="archiveClient()">📁 В архив</button>'
          ) +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="section-title">💬 Новый комментарий</div>' +
        '<textarea id="newComment" placeholder="Введите комментарий…"></textarea>' +
        '<button class="btn full" style="margin-top:8px" onclick="addComment()">Добавить комментарий</button>' +
      '</div>';
  }

  html +=
    '<div class="section">' +
      '<div class="section-title">💬 История комментариев</div>' +
      (
        (data.comments || []).length
          ? data.comments.map(item =>
              '<div class="detail-row">' +
                '<div class="detail-label">' +
                  esc(item.timestamp || '') +
                  (item.userName ? ' · ' + esc(item.userName) : '') +
                '</div>' +
                '<div class="detail-value">' +
                  esc(item.text || '') +
                '</div>' +
              '</div>'
            ).join('')
          : '<div class="empty">Комментариев пока нет</div>'
      ) +
    '</div>';

  html +=
    '<div class="section">' +
      '<div class="section-title">🕘 История изменений</div>' +
      (
        (data.history || []).length
          ? data.history.slice(0, 50).map(item =>
              '<div class="detail-row">' +
                '<div class="detail-label">' +
                  esc(item.timestamp || '') +
                  (item.userName ? ' · ' + esc(item.userName) : '') +
                '</div>' +
                '<div class="detail-value"><strong>' +
                  esc(item.field || '') +
                '</strong><br>' +
                  esc(item.oldValue || '—') +
                  ' → ' +
                  esc(item.newValue || '—') +
                '</div>' +
              '</div>'
            ).join('')
          : '<div class="empty">История пока пуста</div>'
      ) +
    '</div>';

  document.getElementById('clientContent').innerHTML = html;
}

function openCreate() {
  if (state.role !== 'ADMIN') return;

  state.formMode = 'create';

  document.getElementById('formTitle').textContent =
    'Новый клиент';

  document.getElementById('editForm').reset();

  document.getElementById('eStatus').innerHTML =
    state.statuses.map(status =>
      '<option value="' + escAttr(status) + '">' + esc(status) + '</option>'
    ).join('');

  document.getElementById('eStatus').value =
    state.statuses.includes('Подготовка')
      ? 'Подготовка'
      : (state.statuses[0] || '');

  document.getElementById('eBalanceType').value = 'amount';

  document.getElementById('editOverlay')
    .classList.remove('hidden');
}

function openEdit() {
  if (state.role !== 'ADMIN' || !state.currentClient) return;

  state.formMode = 'edit';

  document.getElementById('formTitle').textContent =
    'Редактирование';

  const c = state.currentClient;

  document.getElementById('eName').value = c.name || '';
  document.getElementById('ePhone').value = c.phone || '';
  document.getElementById('eReceivedDate').value = dateToInput(c.receivedDate);
  document.getElementById('ePower').checked = Boolean(c.powerOfAttorney);
  document.getElementById('eDefendant').value = c.defendant || '';

  document.getElementById('eStatus').innerHTML =
    state.statuses.map(status =>
      '<option value="' + escAttr(status) + '">' + esc(status) + '</option>'
    ).join('');

  document.getElementById('eStatus').value = c.status || 'Подготовка';
  document.getElementById('eSentDate').value = dateToInput(c.sentToCourtDate);
  document.getElementById('eJudge').value = c.judge || '';
  document.getElementById('eCaseNumber').value = c.caseNumber || '';
  document.getElementById('eNextDate').value = dateToInput(c.nextDate);
  document.getElementById('eNextTime').value = c.nextTime || '';
  document.getElementById('eExpert').value = c.expert || '';
  document.getElementById('eComment').value = c.comment || '';
  document.getElementById('eScans').value = c.scans || '';
  document.getElementById('eCaseCard').value = c.caseCard || '';
  document.getElementById('eTotal').value =
    Number(c.totalPayment || 0) || '';
  document.getElementById('eBalance').value =
    Number(c.balance || 0) || '';
  document.getElementById('eBalanceType').value = 'amount';

  document.getElementById('editOverlay').classList.remove('hidden');
}

function closeEdit() {
  document.getElementById('editOverlay').classList.add('hidden');
}

function saveEdit(event) {
  event.preventDefault();

  if (state.role !== 'ADMIN') return;

  if (
    state.formMode === 'edit' &&
    !state.currentClient
  ) {
    return;
  }

  const payload = {
    name: val('eName'),
    phone: val('ePhone'),
    receivedDate: val('eReceivedDate'),
    powerOfAttorney: document.getElementById('ePower').checked,
    defendant: val('eDefendant'),
    status: val('eStatus'),
    sentToCourtDate: val('eSentDate'),
    judge: val('eJudge'),
    caseNumber: val('eCaseNumber'),
    nextDate: val('eNextDate'),
    nextTime: val('eNextTime'),
    expert: val('eExpert'),
    comment: val('eComment'),
    scans: val('eScans'),
    caseCard: val('eCaseCard'),
    totalPayment: val('eTotal'),
    balance: val('eBalance'),
    balanceType: val('eBalanceType')
  };

  showLoader();

  const request =
    state.formMode === 'create'
      ? apiCall('apiCreateClient', [payload])
      : apiCall('apiUpdateClient', [state.currentClient.id, payload]);

  request
    .then(data => {
      state.currentClient = data.client;
      state.currentClientData = data;

      closeEdit();
      renderClientDetail(data);

      document.getElementById('clientOverlay')
        .classList.remove('hidden');

      return refreshClients();
    })
    .then(() => hideLoader())
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}

function addComment() {
  if (state.role !== 'ADMIN' || !state.currentClient) return;

  const input = document.getElementById('newComment');
  const text = input ? input.value.trim() : '';

  if (!text) return;

  showLoader();

  apiCall('apiAddComment', [state.currentClient.id, text])
    .then(data => {
      state.currentClient = data.client;
      state.currentClientData = data;

      renderClientDetail(data);

      return refreshClients();
    })
    .then(() => hideLoader())
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}

function archiveClient() {
  if (state.role !== 'ADMIN' || !state.currentClient) return;

  if (!confirm('Переместить клиента в архив?')) return;

  showLoader();

  apiCall('apiArchiveClient', [state.currentClient.id])
    .then(() => {
      closeClient();
      return refreshClients();
    })
    .then(() => hideLoader())
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}

function restoreClient() {
  if (state.role !== 'ADMIN' || !state.currentClient) return;

  showLoader();

  apiCall('apiRestoreClient', [state.currentClient.id])
    .then(data => {
      state.currentClient = data.client;
      state.currentClientData = data;
      renderClientDetail(data);
      return refreshClients();
    })
    .then(() => hideLoader())
    .catch(error => {
      hideLoader();
      alert(error.message || String(error));
    });
}


function testViewerProtection() {
  if (state.role !== 'VIEWER') {
    alert('Тест предназначен только для VIEWER.');
    return;
  }

  showLoader();

  apiCall(
    'apiArchiveClient',
    ['TEST-NONEXISTENT-CLIENT-ID']
  )
    .then(() => {
      hideLoader();

      alert(
        '❌ ВНИМАНИЕ: сервер разрешил защищённую операцию VIEWER. ' +
        'Это ошибка, дальнейшее тестирование остановить.'
      );
    })
    .catch(error => {
      hideLoader();

      const message =
        error && error.message
          ? error.message
          : String(error);

      const normalized =
        message.toLowerCase();

      if (
        normalized.includes('только администратору') ||
        normalized.includes('недостаточно прав')
      ) {
        alert(
          '✅ Серверная защита работает.\n\n' +
          message
        );
      } else {
        alert(
          '⚠️ Получен другой ответ сервера:\n\n' +
          message
        );
      }
    });
}


function refreshClients() {
  return apiCall('apiGetClients', [false])
    .then(clients => {
      state.clients = clients || [];
      renderClients();
    });
}

function detail(label, value) {
  return (
    '<div class="detail-row">' +
      '<div class="detail-label">' + esc(label) + '</div>' +
      '<div class="detail-value">' + value + '</div>' +
    '</div>'
  );
}

function dateToInput(date) {
  if (!date) return '';

  const match = String(date).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

  if (!match) return '';

  return match[3] + '-' + match[2] + '-' + match[1];
}

function val(id) {
  return document.getElementById(id).value.trim();
}

function money(value) {
  const num = Number(value || 0);

  return new Intl.NumberFormat(
    'ru-RU',
    { maximumFractionDigits: 2 }
  ).format(num) + ' ₽';
}

function showLoader() {
  document.getElementById('loader').classList.remove('hidden');
}

function hideLoader() {
  document.getElementById('loader').classList.add('hidden');
}

function fatal(message) {
  hideLoader();
  document.getElementById('app').classList.add('hidden');

  const box = document.getElementById('errorBox');
  box.textContent = 'CRM недоступна: ' + message;
  box.classList.remove('hidden');
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escAttr(value) {
  return esc(value);
}
</script>
